name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & lint (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev pkg-config build-essential

      # 主要目的：验证代码能否编译。
      # 这一步不需要 Wayland 会话——只要 libwayland 头文件与 pkg-config 就位即可。
      - name: Build
        run: cargo build --verbose

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # 集成测试：在无显示环境下用 headless Sway 验证核心假设——
  # 焦点切换时能否稳定输出 app_id。
  # wlroots 支持 headless / x11 backend（WLR_BACKENDS 可选值之一），
  # 因此无需真实显示器即可运行 wlroots 系 compositor。
  # 已转正为硬性 gate（不再 continue-on-error）：核心链路被破坏必须立刻红。
  integration:
    name: Integration (headless Sway)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev pkg-config build-essential \
            sway dbus-x11
      - name: Build (bins + examples)
        run: cargo build --bins --examples

      - name: Start headless Sway
        run: |
          mkdir -p ~/.config/sway
          printf 'focus_follows_mouse no\n' > ~/.config/sway/config
          export WLR_BACKENDS=headless
          export WLR_LIBINPUT_NO_DEVICES=1
          export WLR_RENDERER_ALLOW_SOFTWARE=1
          nohup dbus-run-session sway > /tmp/sway.log 2>&1 &
          for i in $(seq 1 30); do
            if ls "$XDG_RUNTIME_DIR"/wayland-* >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "=== available wayland sockets ==="
          ls -1 "$XDG_RUNTIME_DIR"/wayland-* 2>&1 || true
          # swaymsg 走的是 sway 自己的 IPC socket，不是 WAYLAND_DISPLAY，
          # 必须显式导出，否则报 "Unable to retrieve socket path"。
          SWAYSOCK=$(ls -1 "$XDG_RUNTIME_DIR"/sway-ipc.*.sock 2>/dev/null | head -1)
          echo "SWAYSOCK=$SWAYSOCK" >> $GITHUB_ENV
          echo "sway IPC socket: ${SWAYSOCK:-<not found>}"
          echo "=== sway log ==="
          tail -20 /tmp/sway.log 2>&1 || true

      - name: Launch clients and verify focus tracking
        run: |
          export WLR_BACKENDS=headless
          for s in wayland-1 wayland-0; do
            if [ -S "$XDG_RUNTIME_DIR/$s" ]; then export WAYLAND_DISPLAY=$s; break; fi
          done
          echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY"

          # 无 GPU 的 runner 上，EGL 系客户端（foot/weston-flower/zenity）
          # 进程存活但永远不 map 窗口。改用自带的 dummy-window：
          # 纯 wl_shm 提交，无任何 GPU 依赖。
          # timeout 20：若 20s 内没走到 mapped（未收到 configure），僵尸退出。
          nohup timeout 20 ./target/debug/examples/dummy-window --app-id focusd.win1 --title one > /tmp/w1.log 2>&1 &
          sleep 3
          nohup timeout 20 ./target/debug/examples/dummy-window --app-id focusd.win2 --title two > /tmp/w2.log 2>&1 &
          sleep 3

          echo "--- w1.log ---"; cat /tmp/w1.log || true
          echo "--- w2.log ---"; cat /tmp/w2.log || true

          echo "=== swaymsg tree (app_id list) ==="
          swaymsg -t get_tree 2>&1 | grep -o '"app_id":"[^"]*"' | sort -u || true

          timeout 25 env RUST_LOG=debug ./target/debug/focusd watch > /tmp/focusd.out 2>&1 &
          FD_PID=$!
          sleep 4
          swaymsg focus right 2>&1 || true
          sleep 3
          swaymsg focus left 2>&1 || true
          sleep 3
          kill $FD_PID 2>/dev/null || true

          echo "=== focusd output ==="
          cat /tmp/focusd.out
          echo "=== line count ==="
          wc -l < /tmp/focusd.out

          echo "=== assertion ==="
          if grep -q "focusd.win" /tmp/focusd.out; then
            echo "VERIFIED: focusd 捕获到了焦点切换"
          else
            echo "NOT VERIFIED: focusd 输出中没有预期的 app_id"
            exit 1
          fi

      # serve 模式 + D-Bus 契约断言：
      # serve 与 busctl 客户端必须共享同一个 session bus——
      # 用 dbus-run-session 包住整段脚本，两者继承同一 DBUS_SESSION_BUS_ADDRESS。
      # （sway 在上一个 step 已启动，serve 只作为 Wayland client 连它。）
      - name: Serve mode + D-Bus assertions (GetFocus / FocusChanged)
        run: |
          export WLR_BACKENDS=headless
          for s in wayland-1 wayland-0; do
            if [ -S "$XDG_RUNTIME_DIR/$s" ]; then export WAYLAND_DISPLAY=$s; break; fi
          done
          echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY"

          dbus-run-session bash -s <<'EOF'
          set -e
          export RUST_LOG=debug

          # 1) serve 启动（wlroots 后端连外层的 Sway）
          ./target/debug/focusd serve --backend wlroots > /tmp/serve.log 2>&1 &
          SERVE_PID=$!
          sleep 3

          # 2) 两个 dummy 窗口；后 map 的 win2 拿到焦点
          ./target/debug/examples/dummy-window --app-id focusd.win1 --title one > /tmp/w1.log 2>&1 &
          sleep 3
          ./target/debug/examples/dummy-window --app-id focusd.win2 --title two > /tmp/w2.log 2>&1 &
          sleep 3

          # 3) GetFocus 应返回当前焦点 app_id
          echo "=== GetFocus ==="
          OUT=$(busctl --user call org.focusd.Focus1 /org/focusd/Focus1 org.focusd.Focus1 GetFocus)
          echo "$OUT"
          echo "$OUT" | grep -q "focusd.win2" || {
            echo "FAIL: GetFocus 未返回 focusd.win2"
            echo "=== serve log ==="; cat /tmp/serve.log
            kill $SERVE_PID 2>/dev/null || true
            exit 1
          }
          echo "VERIFIED: GetFocus 返回当前焦点 app_id"

          # 4) 监听 FocusChanged 后切窗
          timeout 15 busctl --user monitor > /tmp/monitor.log 2>&1 &
          MON_PID=$!
          sleep 2
          swaymsg focus left || true
          sleep 4
          kill $MON_PID 2>/dev/null || true

          echo "=== monitor 捕获 ==="
          cat /tmp/monitor.log || true
          grep -q "FocusChanged" /tmp/monitor.log || {
            echo "FAIL: 未捕获 FocusChanged 信号"
            echo "=== serve log ==="; cat /tmp/serve.log
            kill $SERVE_PID 2>/dev/null || true
            exit 1
          }
          echo "VERIFIED: FocusChanged 信号被外部客户端捕获"

          kill $SERVE_PID 2>/dev/null || true
          echo "=== serve log ==="
          cat /tmp/serve.log
          EOF

          # 5) 无 compositor 时 serve 必须明确报错退出（不挂死）
          if env -u WAYLAND_DISPLAY ./target/debug/focusd serve --backend wlroots > /tmp/nocomp.log 2>&1; then
            echo "FAIL: 无 compositor 时 serve 不应成功"
            exit 1
          fi
          echo "=== no-compositor serve log ==="
          cat /tmp/nocomp.log
          echo "VERIFIED: 无 compositor 时 serve 明确报错退出"

  # 冒烟测试：确认二进制能启动且在没有 wlroots compositor 时给出明确的错误提示，
  # 而不是崩溃或静默挂起。
  smoke:
    name: Smoke test (no compositor)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev pkg-config build-essential
      - name: Build
        run: cargo build
      - name: probe 在无 Wayland 环境下应优雅退出
        run: |
          set +e
          unset WAYLAND_DISPLAY
          ./target/debug/focusd probe
          echo "exit code: $?"
