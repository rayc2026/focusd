[package]
name = "focusd"
version = "0.1.0"
edition = "2021"
description = "Cross-compositor focused-application detection for Wayland"
license = "MIT OR Apache-2.0"

# 注意：本项目只能在 Linux 上构建（依赖 libwayland-client）。
# Windows / macOS 上 cargo build 会失败，这是预期行为。

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

# D-Bus（zbus 5 的 blocking API 自带内部 executor 线程，无需引入 tokio）
zbus = "5"
