name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & lint (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev pkg-config build-essential

      # 主要目的：验证代码能否编译。
      # 这一步不需要 Wayland 会话——只要 libwayland 头文件与 pkg-config 就位即可。
      - name: Build
        run: cargo build --verbose

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # 冒烟测试：确认二进制能启动且在没有 wlroots compositor 时给出明确的错误提示，
  # 而不是崩溃或静默挂起。真正的交互验证（切窗口观察输出）需要在真实
  # wlroots 会话中手工进行。
  smoke:
    name: Smoke test (no compositor)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev pkg-config build-essential
      - name: Build
        run: cargo build
      - name: probe 在无 Wayland 环境下应优雅退出
        run: |
          set +e
          unset WAYLAND_DISPLAY
          ./target/debug/focusd probe
          echo "exit code: $?"
