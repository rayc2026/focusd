name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & lint (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev pkg-config build-essential

      # 主要目的：验证代码能否编译。
      # 这一步不需要 Wayland 会话——只要 libwayland 头文件与 pkg-config 就位即可。
      - name: Build
        run: cargo build --verbose

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # 实验性集成测试：在无显示环境下用 headless Sway 验证核心假设——
  # 焦点切换时能否稳定输出 app_id。
  # wlroots 支持 headless / x11 backend（WLR_BACKENDS 可选值之一），
  # 因此无需真实显示器即可运行 wlroots 系 compositor。
  # 设置为 continue-on-error：环境适配存在不确定性，失败不阻塞主流程，
  # 但一旦成功就能证明核心链路可用。
  integration:
    name: Integration (headless Sway)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev pkg-config build-essential \
            sway weston dbus-x11
      - name: Build
        run: cargo build

      - name: Start headless Sway
        run: |
          mkdir -p ~/.config/sway
          printf 'focus_follows_mouse no\n' > ~/.config/sway/config
          export WLR_BACKENDS=headless
          export WLR_LIBINPUT_NO_DEVICES=1
          export WLR_RENDERER_ALLOW_SOFTWARE=1
          nohup dbus-run-session sway > /tmp/sway.log 2>&1 &
          for i in $(seq 1 30); do
            if ls "$XDG_RUNTIME_DIR"/wayland-* >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "=== available wayland sockets ==="
          ls -1 "$XDG_RUNTIME_DIR"/wayland-* 2>&1 || true
          echo "=== sway log ==="
          tail -20 /tmp/sway.log 2>&1 || true

      - name: Launch clients and verify focus tracking
        run: |
          export WLR_BACKENDS=headless
          # 以 wayland-1 优先（sway 通常新开一个 socket），回退到 wayland-0
          for s in wayland-1 wayland-0; do
            if [ -S "$XDG_RUNTIME_DIR/$s" ]; then export WAYLAND_DISPLAY=$s; break; fi
          done
          echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY"

          nohup weston-terminal >/dev/null 2>&1 &
          sleep 2
          nohup weston-terminal >/dev/null 2>&1 &
          sleep 3

          echo "=== swaymsg tree (app_id list) ==="
          swaymsg -t get_tree 2>&1 | grep -o '"app_id":"[^"]*"' | sort -u || true

          timeout 25 ./target/debug/focusd watch > /tmp/focusd.out 2>&1 &
          FD_PID=$!
          sleep 4
          swaymsg focus right 2>&1 || true
          sleep 3
          swaymsg focus left 2>&1 || true
          sleep 3
          kill $FD_PID 2>/dev/null || true

          echo "=== focusd output ==="
          cat /tmp/focusd.out
          echo "=== line count ==="
          wc -l < /tmp/focusd.out

  # 冒烟测试：确认二进制能启动且在没有 wlroots compositor 时给出明确的错误提示，
  # 而不是崩溃或静默挂起。
  smoke:
    name: Smoke test (no compositor)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev pkg-config build-essential
      - name: Build
        run: cargo build
      - name: probe 在无 Wayland 环境下应优雅退出
        run: |
          set +e
          unset WAYLAND_DISPLAY
          ./target/debug/focusd probe
          echo "exit code: $?"
